name: Bug report
description: Report a problem with ProofIssue itself
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private artifacts, or security vulnerabilities. Use private security reporting for sensitive issues.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProofIssue version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js, npm, and Docker versions as relevant. Remove usernames and local paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Use only public or synthetic data. Never paste secrets.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, usernames, and local absolute paths.
          required: true
